<!doctype html>
<html lang="el">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>myenfia · Υπολογισμός ΕΝΦΙΑ 2026 για διαμέρισμα</title>
  <meta name="description" content="Δωρεάν υπολογισμός ΕΝΦΙΑ 2026 για διαμέρισμα σε όλη την Ελλάδα, με τις επίσημες τιμές ζώνης της ΑΑΔΕ στον χάρτη και πλήρη ανάλυση του φόρου.">
  <meta property="og:title" content="myenfia · Υπολογισμός ΕΝΦΙΑ 2026">
  <meta property="og:description" content="Εντοπίστε το ακίνητο στον χάρτη και δείτε τον ΕΝΦΙΑ με πλήρη ανάλυση.">
  <meta name="theme-color" content="#ffffff">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sofia+Sans:wght@400;500;600&family=Sofia+Sans+Semi+Condensed:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <header class="masthead">
    <div class="wrap masthead-inner">
      <a class="wordmark" href="./">myenfia</a>
      <nav class="nav">
        <a href="#how" data-i18n="nav.how">Μεθοδολογία</a>
        <span class="lang" role="group" aria-label="Language">
          <button type="button" data-lang="el" aria-pressed="true">ΕΛ</button><button type="button" data-lang="en" aria-pressed="false">EN</button>
        </span>
      </nav>
    </div>
  </header>

  <main>
    <section class="wrap intro">
      <h1 data-i18n="hero.title">Υπολογισμός ΕΝΦΙΑ</h1>
      <dl class="facts">
        <div><dt data-i18n="fact.year">Φορολογικό έτος</dt><dd>2026</dd></div>
        <div><dt data-i18n="fact.scope">Ακίνητο</dt><dd data-i18n="fact.scopeV">Διαμέρισμα</dd></div>
        <div><dt data-i18n="fact.region">Περιοχή</dt><dd data-i18n="fact.regionV">Όλη η Ελλάδα</dd></div>
        <div><dt data-i18n="fact.data">Τιμές ζώνης</dt><dd data-i18n="fact.dataV">ΑΑΔΕ</dd></div>
      </dl>
    </section>

    <section class="wrap calc">
      <form class="sheet" id="form" novalidate onsubmit="return false">
        <section class="part">
          <h2 class="part-title"><span class="num">1</span><span data-i18n="step1">Τοποθεσία</span></h2>
          <div class="part-body">
            <p class="hint" data-i18n="step1.hint"></p>
            <div class="search">
              <input id="q" type="search" autocomplete="street-address" data-i18n-placeholder="search.placeholder">
              <button type="button" id="searchBtn" class="btn" data-i18n="search.btn">Αναζήτηση</button>
            </div>
            <p class="msg" id="searchMsg" role="status"></p>
            <div id="map" class="map" role="application" aria-label="Map"></div>
            <div id="zoneBox" class="zone" aria-live="polite"></div>
            <details class="manual" id="manualBox">
              <summary data-i18n="zone.manual">Χειροκίνητη τιμή ζώνης</summary>
              <label class="field narrow">
                <span class="hint" data-i18n="zone.manualHint"></span>
                <span class="input-unit"><input id="manualPrice" type="number" inputmode="numeric" min="100" max="20000" step="50"><span>€/m²</span></span>
              </label>
            </details>
          </div>
        </section>

        <section class="part">
          <h2 class="part-title"><span class="num">2</span><span data-i18n="step2">Το διαμέρισμα</span></h2>
          <div class="part-body grid2">
            <label class="field">
              <span class="label" data-i18n="f.area">Εμβαδόν κύριων χώρων</span>
              <span class="input-unit"><input id="area" type="number" inputmode="decimal" min="10" max="1000" step="1" placeholder="85"><span data-i18n="unit.sqm">τ.μ.</span></span>
              <span class="hint" data-i18n="f.areaHint"></span>
            </label>
            <label class="field">
              <span class="label" data-i18n="f.year">Έτος οικοδομικής άδειας</span>
              <input id="year" type="number" inputmode="numeric" min="1850" max="2026" step="1" placeholder="1985">
              <span class="hint" data-i18n="f.yearHint"></span>
            </label>
            <label class="field">
              <span class="label" data-i18n="f.floor">Όροφος</span>
              <select id="floor"></select>
            </label>
            <label class="field">
              <span class="label" data-i18n="f.aux">Αποθήκη / θέση στάθμευσης</span>
              <span class="input-unit"><input id="aux" type="number" inputmode="decimal" min="0" max="500" step="1" placeholder="0"><span data-i18n="unit.sqm">τ.μ.</span></span>
              <span class="hint" data-i18n="f.auxHint"></span>
            </label>
            <div class="field span2">
              <span class="label" data-i18n="f.frontage">Προσόψεις σε δρόμο</span>
              <div class="seg" id="frontage" role="radiogroup">
                <label><input type="radio" name="front" value="0"><span data-i18n="front.0"></span></label>
                <label><input type="radio" name="front" value="1" checked><span data-i18n="front.1"></span></label>
                <label><input type="radio" name="front" value="2"><span data-i18n="front.2"></span></label>
              </div>
            </div>
          </div>
        </section>

        <section class="part">
          <h2 class="part-title"><span class="num">3</span><span data-i18n="step3">Ιδιοκτησία & εκπτώσεις</span></h2>
          <div class="part-body grid2">
            <label class="field">
              <span class="label" data-i18n="f.share">Ποσοστό συνιδιοκτησίας</span>
              <span class="input-unit"><input id="share" type="number" inputmode="decimal" min="1" max="100" step="0.01" value="100"><span>%</span></span>
            </label>
            <label class="field">
              <span class="label" data-i18n="f.other">Αξία άλλων ακινήτων σας</span>
              <span class="input-unit"><input id="other" type="number" inputmode="numeric" min="0" step="1000" placeholder="0"><span>€</span></span>
              <span class="hint" data-i18n="f.otherHint"></span>
            </label>
            <label class="check span2">
              <input id="insured" type="checkbox">
              <span class="box" aria-hidden="true"></span>
              <span><span class="label" data-i18n="f.insured">Ασφαλισμένη κατοικία</span><span class="hint" data-i18n="f.insuredHint"></span></span>
            </label>
            <label class="check span2" id="villageRow">
              <input id="village" type="checkbox">
              <span class="box" aria-hidden="true"></span>
              <span><span class="label" data-i18n="f.village">Κύρια κατοικία σε μικρό οικισμό</span><span class="hint" data-i18n="f.villageHint"></span></span>
            </label>
          </div>
        </section>
      </form>

      <aside class="statement" id="result" aria-live="polite">
        <div class="statement-inner">
          <p class="statement-head"><span data-i18n="res.title">Εκτιμώμενος ΕΝΦΙΑ 2026</span></p>
          <div id="resultBody"></div>
        </div>
      </aside>
    </section>

    <section class="wrap how" id="how">
      <h2 data-i18n="how.title">Πώς υπολογίζεται</h2>
      <div class="how-grid">
        <div class="how-text">
          <p data-i18n-html="how.p1"></p>
          <p data-i18n-html="how.p2"></p>
          <p data-i18n="how.p3"></p>
        </div>
        <div class="limits">
          <h3 data-i18n="how.limits">Τι δεν περιλαμβάνεται</h3>
          <ul>
            <li data-i18n="how.l1"></li>
            <li data-i18n="how.l2"></li>
            <li data-i18n="how.l3"></li>
            <li data-i18n="how.l4"></li>
          </ul>
        </div>
      </div>
      <p class="disclaimer" data-i18n="disclaimer"></p>
    </section>
  </main>

  <div class="mobilebar" id="mobilebar" hidden>
    <a href="#result"><span data-i18n="res.title"></span><strong id="mobileTotal"></strong></a>
  </div>

  <footer class="footer">
    <div class="wrap footer-inner">
      <p id="footerData"></p>
      <p><a href="https://github.com/nikvemmos/myenfia">GitHub</a></p>
    </div>
  </footer>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
  <script type="module" src="assets/js/app.js"></script>
</body>
</html>
